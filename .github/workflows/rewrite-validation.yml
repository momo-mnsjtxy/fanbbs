name: Rewrite validation

on:
  push:
    branches: [ci/rewrite-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fanbbs-web-rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vue-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser interaction checks
        run: npm run test:e2e
