name: Rewrite validation

on:
  push:
    branches: [ci/rewrite-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fanbbs-web-rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vue-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: momo-mnsjtxy/fanbbsapi
          # Pin the verified backend pair so frontend CI cannot race a later
          # backend branch update while browser checks are running.
          ref: 5915071376ddac130938dac5c4d22227e56063b1
          path: backend
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build local Go API fixture
        working-directory: backend
        run: go build -o "$RUNNER_TEMP/fanbbs-api" ./cmd/api
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser interaction checks
        run: |
          FANBBS_DB="$RUNNER_TEMP/e2e.db" FANBBS_BLOB_DIR="$RUNNER_TEMP/e2e-blobs" FANBBS_ADDR=127.0.0.1:8080 "$RUNNER_TEMP/fanbbs-api" >"$RUNNER_TEMP/e2e-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 80); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep .25; done
          curl -fsS 'http://127.0.0.1:8080/api/v1/posts?feed=recommend&limit=2' > /dev/null
          npm run test:e2e
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanbbs-browser-results
          path: |
            test-results
            ${{ runner.temp }}/e2e-api.log
          if-no-files-found: error
